[project]
name = "t2s_cli"
version = "0.1.0"
description = "click-based command line surface for text-to-sql."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "foundation",
    "sqlglot>=25.0",
    "t2s_core",
]

[project.scripts]
t2s = "t2s_cli.cli:cli"

[tool.uv.sources]
foundation = { workspace = true }
t2s_core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2s_cli"]
