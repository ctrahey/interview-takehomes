[project]
name = "foundation"
version = "0.1.0"
description = "Stateful persistence and sample database lifecycle (SQLAlchemy + SQLite)."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "sqlglot>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundation"]
