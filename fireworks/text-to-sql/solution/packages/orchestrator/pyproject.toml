[project]
name = "t2s_nl"
version = "0.1.0"
description = "The natural-language orchestrator (layer 3): intent routing over foundation + t2s_core."
requires-python = ">=3.12"
dependencies = [
    "foundation",
    "pydantic>=2.8",
    "sqlglot>=25.0",
    "t2s_core",
]

[project.scripts]
t2s-chat = "t2s_nl.chat:main"

[tool.uv.sources]
foundation = { workspace = true }
t2s_core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2s_nl"]
