[project]
name = "t2s_core"
version = "0.1.0"
description = "Stateless text-to-SQL generation, validation, and repair (no foundation dependency)."
requires-python = ">=3.12"
dependencies = [
    "sqlglot>=25.0",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2s_core"]
